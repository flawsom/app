name: CI/CD Pipeline - Project UNIFY

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # Environment Testing
  test-environment:
    runs-on: ubuntu-latest
    name: Test Environment Configuration
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
    
    - name: Install dependencies
      run: |
        npm install -g axios
        npm install
    
    - name: Create test environment files
      run: |
        cp backend/.env.example backend/.env
        cp frontend/.env.example frontend/.env.local
        
        # Set test values
        sed -i 's/your-super-secret-jwt-key-here-minimum-32-characters/test-jwt-secret-key-that-is-long-enough-for-testing-purposes/' backend/.env
        sed -i 's/your-super-secret-refresh-key-here-minimum-32-characters/test-refresh-secret-key-that-is-long-enough-for-testing/' backend/.env
        sed -i 's/postgresql:\/\/postgres:password@localhost:5432\/project_unify/postgresql:\/\/postgres:postgres@localhost:5432\/test_db/' backend/.env
        
        echo "NEXT_PUBLIC_API_URL=http://localhost:3001" >> frontend/.env.local
    
    - name: Run environment tests
      run: node scripts/test-environment.js
      continue-on-error: true
    
    - name: Upload environment test results
      uses: actions/upload-artifact@v4
      with:
        name: environment-test-report
        path: environment-test-report.json

  # Backend Testing
  test-backend:
    runs-on: ubuntu-latest
    name: Test Backend
    
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test_db
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
      
      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
        cache-dependency-path: backend/package-lock.json
    
    - name: Install backend dependencies
      run: |
        cd backend
        npm ci
    
    - name: Create test environment
      run: |
        cd backend
        cp .env.example .env
        sed -i 's/your-super-secret-jwt-key-here-minimum-32-characters/test-jwt-secret-key-that-is-long-enough-for-testing-purposes/' .env
        sed -i 's/your-super-secret-refresh-key-here-minimum-32-characters/test-refresh-secret-key-that-is-long-enough-for-testing/' .env
    
    - name: Run backend linting
      run: |
        cd backend
        npm run lint || echo "Linting completed with warnings"
    
    - name: Run backend tests
      run: |
        cd backend
        npm test
      env:
        DATABASE_URL: postgresql://postgres:postgres@localhost:5432/test_db
        REDIS_URL: redis://localhost:6379
        JWT_SECRET: test-jwt-secret-key-that-is-long-enough-for-testing-purposes
        JWT_REFRESH_SECRET: test-refresh-secret-key-that-is-long-enough-for-testing
        NODE_ENV: test
    
    - name: Build backend
      run: |
        cd backend
        npm run build
    
    - name: Upload backend build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: backend-build
        path: backend/dist/

  # Frontend Testing
  test-frontend:
    runs-on: ubuntu-latest
    name: Test Frontend
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
        cache-dependency-path: frontend/package-lock.json
    
    - name: Install frontend dependencies
      run: |
        cd frontend
        npm ci
    
    - name: Create test environment
      run: |
        cd frontend
        cp .env.example .env.local
        echo "NEXT_PUBLIC_API_URL=http://localhost:3001" >> .env.local
    
    - name: Run frontend linting
      run: |
        cd frontend
        npm run lint || echo "Linting completed with warnings"
    
    - name: Run frontend tests
      run: |
        cd frontend
        npm test -- --watchAll=false
    
    - name: Build frontend
      run: |
        cd frontend
        npm run build
    
    - name: Upload frontend build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: frontend-build
        path: frontend/.next/

  # Security Scanning
  security-scan:
    runs-on: ubuntu-latest
    name: Security Scan
    needs: [test-backend, test-frontend]
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Run Trivy vulnerability scanner
      uses: aquasecurity/trivy-action@master
      with:
        scan-type: 'fs'
        scan-ref: '.'
        format: 'sarif'
        output: 'trivy-results.sarif'
    
    - name: Upload Trivy scan results
      uses: github/codeql-action/upload-sarif@v3
      if: always()
      with:
        sarif_file: 'trivy-results.sarif'
    
    - name: Audit npm packages (Backend)
      run: |
        cd backend
        npm audit --audit-level moderate
      continue-on-error: true
    
    - name: Audit npm packages (Frontend)
      run: |
        cd frontend
        npm audit --audit-level moderate
      continue-on-error: true

  # Build Docker Images
  build-images:
    runs-on: ubuntu-latest
    name: Build Docker Images
    needs: [test-backend, test-frontend, security-scan]
    if: github.ref == 'refs/heads/main'
    
    permissions:
      contents: read
      packages: write
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
    
    - name: Log in to Container Registry
      uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    
    - name: Extract metadata (Backend)
      id: meta-backend
      uses: docker/metadata-action@v5
      with:
        images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-backend
        tags: |
          type=ref,event=branch
          type=sha,prefix={{branch}}-
          type=raw,value=latest,enable={{is_default_branch}}
    
    - name: Build and push Backend image
      uses: docker/build-push-action@v5
      with:
        context: ./backend
        file: ./backend/Dockerfile.prod
        push: true
        tags: ${{ steps.meta-backend.outputs.tags }}
        labels: ${{ steps.meta-backend.outputs.labels }}
        cache-from: type=gha
        cache-to: type=gha,mode=max
    
    - name: Extract metadata (Frontend)
      id: meta-frontend
      uses: docker/metadata-action@v5
      with:
        images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-frontend
        tags: |
          type=ref,event=branch
          type=sha,prefix={{branch}}-
          type=raw,value=latest,enable={{is_default_branch}}
    
    - name: Build and push Frontend image
      uses: docker/build-push-action@v5
      with:
        context: ./frontend
        file: ./frontend/Dockerfile.prod
        push: true
        tags: ${{ steps.meta-frontend.outputs.tags }}
        labels: ${{ steps.meta-frontend.outputs.labels }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

  # Deploy to Staging
  deploy-staging:
    runs-on: ubuntu-latest
    name: Deploy to Staging
    needs: [build-images]
    if: github.ref == 'refs/heads/main'
    environment: staging
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Deploy to Railway (Staging)
      run: |
        echo "Deploying to Railway staging environment..."
        # Add Railway deployment commands here
        # railway login --token ${{ secrets.RAILWAY_TOKEN }}
        # railway environment staging
        # railway up
      env:
        RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
    
    - name: Deploy to Vercel (Staging)
      run: |
        echo "Deploying to Vercel staging environment..."
        # Add Vercel deployment commands here
        # vercel --token ${{ secrets.VERCEL_TOKEN }} --env staging
      env:
        VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    
    - name: Run staging health checks
      run: |
        echo "Running health checks on staging environment..."
        # Add health check commands here
        # curl -f ${{ secrets.STAGING_API_URL }}/health

  # Deploy to Production
  deploy-production:
    runs-on: ubuntu-latest
    name: Deploy to Production
    needs: [deploy-staging]
    if: github.ref == 'refs/heads/main'
    environment: production
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Deploy to Railway (Production)
      run: |
        echo "Deploying to Railway production environment..."
        # Add Railway production deployment commands here
      env:
        RAILWAY_TOKEN: ${{ secrets.RAILWAY_PROD_TOKEN }}
    
    - name: Deploy to Vercel (Production)
      run: |
        echo "Deploying to Vercel production environment..."
        # Add Vercel production deployment commands here
      env:
        VERCEL_TOKEN: ${{ secrets.VERCEL_PROD_TOKEN }}
    
    - name: Run production health checks
      run: |
        echo "Running health checks on production environment..."
        # Add production health check commands here
    
    - name: Notify deployment success
      uses: 8398a7/action-slack@v3
      if: success()
      with:
        status: success
        text: 'Project UNIFY deployed successfully to production! 🚀'
      env:
        SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
    
    - name: Notify deployment failure
      uses: 8398a7/action-slack@v3
      if: failure()
      with:
        status: failure
        text: 'Project UNIFY production deployment failed! ❌'
      env:
        SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

  # Database Migration
  migrate-database:
    runs-on: ubuntu-latest
    name: Run Database Migrations
    needs: [deploy-production]
    if: github.ref == 'refs/heads/main'
    environment: production
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
    
    - name: Install dependencies
      run: |
        cd backend
        npm ci
    
    - name: Run database migrations
      run: |
        cd backend
        npm run migrate
      env:
        DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
    
    - name: Seed database (if needed)
      run: |
        cd backend
        npm run seed
      env:
        DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
      continue-on-error: true

  # Performance Testing
  performance-test:
    runs-on: ubuntu-latest
    name: Performance Testing
    needs: [deploy-production]
    if: github.ref == 'refs/heads/main'
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Run Lighthouse CI
      uses: treosh/lighthouse-ci-action@v10
      with:
        urls: |
          ${{ secrets.PRODUCTION_FRONTEND_URL }}
          ${{ secrets.PRODUCTION_FRONTEND_URL }}/login
        configPath: './.lighthouserc.json'
        uploadArtifacts: true
        temporaryPublicStorage: true
    
    - name: Load test with Artillery
      run: |
        npm install -g artillery
        echo "
        config:
          target: '${{ secrets.PRODUCTION_API_URL }}'
          phases:
            - duration: 60
              arrivalRate: 10
        scenarios:
          - name: 'Health check'
            requests:
              - get:
                  url: '/health'
        " > load-test.yml
        artillery run load-test.yml
      continue-on-error: true

  # Cleanup
  cleanup:
    runs-on: ubuntu-latest
    name: Cleanup
    needs: [deploy-production, migrate-database, performance-test]
    if: always()
    
    steps:
    - name: Clean up old container images
      run: |
        echo "Cleaning up old container images..."
        # Add cleanup commands here
    
    - name: Generate deployment report
      run: |
        echo "Generating deployment report..."
        echo "Deployment completed at: $(date)"
        echo "Git SHA: ${{ github.sha }}"
        echo "Branch: ${{ github.ref_name }}"