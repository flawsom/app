# ─────────────────────────────────────────────────────────────
# UNIFY — Render deployment blueprint
# Domain: https://backend.unifies.codes
#
# Architecture
# ─────────────
#   • web service         : FastAPI backend (APScheduler + Mongo-lock)
#   • cron services       : Render Cron Jobs hit dedicated internal
#                            endpoints protected by X-Cron-Secret.
#                            APScheduler still runs as a fallback but
#                            jobs are idempotent via scheduler_locks.
#
# Notes:
#   • Do NOT commit real secret values. All `sync: false` keys must be
#     set in the Render Dashboard → Environment Variables.
#   • MongoDB Atlas is the system of record (scheduler_locks TTL-indexed).
# ─────────────────────────────────────────────────────────────
services:
  - type: web
    name: unify-api
    runtime: python
    region: oregon
    plan: starter
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn server:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.0"
      - key: APP_VERSION
        value: "1.0.0"
      - key: ENVIRONMENT
        value: production
      - key: FRONTEND_URL
        value: https://www.unifies.codes
      - key: EXTRA_CORS_ORIGINS
        value: https://unifies.codes

      # ── Database ──
      - key: MONGO_URL
        sync: false
      - key: DB_NAME
        value: unify_db

      # ── Security ──
      - key: JWT_SECRET
        generateValue: true
      - key: SCHEDULER_SECRET
        generateValue: true

      # ── Admin & Demo accounts ──
      - key: ADMIN_EMAIL
        value: admin@unifies.codes
      - key: ADMIN_PASSWORD
        sync: false
      - key: STUDENT_DEMO_PASSWORD
        sync: false
      - key: MENTOR_DEMO_PASSWORD
        sync: false
      - key: EMPLOYER_DEMO_PASSWORD
        sync: false
      - key: PLACEMENT_DEMO_PASSWORD
        sync: false

      # ── UNIFY Intelligence Engine ──
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: ANTHROPIC_MODEL
        value: claude-3-5-sonnet-20241022
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-4o
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-2.0-flash
      - key: UNIFY_AI_KEY
        sync: false
      - key: UNIFY_KEY_PROVIDER
        value: openai
      - key: UNIFY_KEY_MODEL
        value: gpt-4o

      # ── Google OAuth (UNIFY Auth) ──
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false

      # ── Live data integrations ──
      - key: RAPIDAPI_KEY
        sync: false
      - key: RAPIDAPI_HOST
        value: jsearch.p.rapidapi.com
      - key: ADZUNA_APP_ID
        sync: false
      - key: ADZUNA_APP_KEY
        sync: false
      - key: CLEARBIT_API_KEY
        sync: false

      # ── Email (Resend) ──
      - key: RESEND_API_KEY
        sync: false
      - key: SENDER_EMAIL
        value: support@unifies.codes

      # ── Observability ──
      - key: SENTRY_DSN_BACKEND
        sync: false
      - key: SENTRY_TRACES_SAMPLE_RATE
        value: "0.1"

  # ─── Cron Jobs — architecturally clean alternative to APScheduler ───
  # Each hits an internal endpoint guarded by X-Cron-Secret + Mongo lock.

  - type: cron
    name: unify-cron-nightly-weights
    runtime: python
    region: oregon
    plan: starter
    schedule: "0 2 * * *"          # 02:00 UTC daily
    buildCommand: ""
    startCommand: |
      curl -sS -X POST \
        -H "X-Cron-Secret: $SCHEDULER_SECRET" \
        https://backend.unifies.codes/api/cron/nightly-weights
    envVars:
      - key: SCHEDULER_SECRET
        sync: false

  - type: cron
    name: unify-cron-weekly-digest
    runtime: python
    region: oregon
    plan: starter
    schedule: "0 9 * * 1"          # Mondays 09:00 UTC
    startCommand: |
      curl -sS -X POST \
        -H "X-Cron-Secret: $SCHEDULER_SECRET" \
        https://backend.unifies.codes/api/cron/weekly-digest
    envVars:
      - key: SCHEDULER_SECRET
        sync: false

  - type: cron
    name: unify-cron-trending-refresh
    runtime: python
    region: oregon
    plan: starter
    schedule: "15 * * * *"         # hourly at :15
    startCommand: |
      curl -sS -X POST \
        -H "X-Cron-Secret: $SCHEDULER_SECRET" \
        https://backend.unifies.codes/api/cron/trending-refresh
    envVars:
      - key: SCHEDULER_SECRET
        sync: false

  - type: cron
    name: unify-cron-streak-resets
    runtime: python
    region: oregon
    plan: starter
    schedule: "5 0 * * *"          # 00:05 UTC daily
    startCommand: |
      curl -sS -X POST \
        -H "X-Cron-Secret: $SCHEDULER_SECRET" \
        https://backend.unifies.codes/api/cron/streak-resets
    envVars:
      - key: SCHEDULER_SECRET
        sync: false
